services:
  - type: web
    name: movesync-api
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements-api.txt
    startCommand: uvicorn sync.main_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
