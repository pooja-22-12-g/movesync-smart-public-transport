name: passenger_mobile_app
description: "Smart Public Transport Passenger Mobile Application with Real-Time Occupancy & Multi-Stop Crowding Forecasting"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Real-Time WebSockets
  http: ^1.2.0
  web_socket_channel: ^3.0.0

  # State Management & DI
  provider: ^6.1.1

  # Local Storage & Secure Preferences
  shared_preferences: ^2.2.2

  # Mapping & UI Rendering
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # UI Enhancement & Visuals
  intl: ^0.19.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

